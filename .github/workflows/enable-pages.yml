name: Activar GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Habilitar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Origen main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          repo="${{ github.repository }}"
          echo "PUT legacy main /"
          gh api -i --method PUT "repos/${repo}/pages" \
            -f build_type=legacy \
            -f source[branch]=main \
            -f source[path]=/
          echo "POST build"
          gh api --method POST "repos/${repo}/pages/builds"
          echo "PATCH description y homepage"
          gh api --method PATCH "repos/${repo}" \
            -f description='Web de Sopa CAD, CAD propio para Windows' \
            -f homepage='https://ardu01.github.io/SopaCad-web/'
          echo "GET pages"
          gh api "repos/${repo}/pages" > /tmp/pages.json
          cat /tmp/pages.json
          echo "GET repo"
          gh api "repos/${repo}" --jq '{description:.description,homepage:.homepage,has_pages:.has_pages}'
          python3 - <<'PY'
          import json,sys
          page=json.load(open("/tmp/pages.json"))
          source=page.get("source") or {}
          ok=page.get("build_type")=="legacy" and source.get("branch")=="main" and source.get("path")=="/"
          print("legacy_main_root", ok)
          sys.exit(0 if ok else 1)
          PY
